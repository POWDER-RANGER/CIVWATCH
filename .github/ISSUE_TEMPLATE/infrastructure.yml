name: Infrastructure / DevOps
description: Infrastructure changes, deployment issues, CI/CD improvements
title: '[INFRA] '
labels: ['infrastructure', 'devops']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Docker / Containers
        - Kubernetes
        - CI/CD Pipeline
        - Monitoring / Alerting
        - Database
        - Networking
        - Secrets Management
        - Performance / Scaling
        - Local Development
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the infrastructure change or issue.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this change needed? What problem does it solve?

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe your proposed approach with configuration examples if applicable.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have reviewed [DEPLOYMENT.md](../../DEPLOYMENT.md)
        - label: I have reviewed [PERFORMANCE.md](../../PERFORMANCE.md)
        - label: I have tested this in a local environment
