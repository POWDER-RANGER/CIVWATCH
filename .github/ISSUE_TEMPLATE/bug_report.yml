name: Bug Report
description: Report a bug or unexpected behavior in CIVWATCH.
title: "[BUG] <brief description>"
labels: ["bug", "triage"]
body:
  - type: textarea
    attributes:
      label: Describe the bug
      description: "A clear description of the bug."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: "How can we reproduce the issue?"
    validations:
      required: true
