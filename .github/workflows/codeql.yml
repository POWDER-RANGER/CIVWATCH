name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 1 * * 0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5  # node24 runtime (was @v4 / node20)

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v5  # node24 runtime (was @v4)
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v5  # node24 runtime (was @v4)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v5  # node24 runtime (was @v4)
        with:
          category: "/language:${{ matrix.language }}"
