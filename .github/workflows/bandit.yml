name: Bandit Python Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5  # node24 runtime (was @v4 / node20)

      - name: Set up Python
        uses: actions/setup-python@v6  # node24 runtime (was @v5 / node20)
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit
        run: bandit -r . -f sarif -o bandit-results.sarif --exit-zero

      - name: Upload Bandit SARIF results
        uses: github/codeql-action/upload-sarif@v4  # node24 runtime (was @v3)
        with:
          sarif_file: bandit-results.sarif
