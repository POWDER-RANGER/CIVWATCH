# Publishes site/ to GitHub Pages (https://powder-ranger.github.io/CIVWATCH/).
# Each run probes every URL in site/data/endpoints.json first, so the status page
# reflects what the live services returned at publish time.
#
# Requires: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "scripts/site/**"
      - ".github/workflows/static.yml"
  schedule:
    # Every six hours, off the top of the hour. Refreshes status.json and repos.json.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe live services and repositories
        # A failed probe must not block publishing; the committed status.json stays as the fallback.
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/site/probe.mjs --out site/data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
