# Build a docker container, publish to Google Artifact Registry,
# and deploy to GKE on push to main.
#
# Prerequisites:
#   1. Enable Artifact Registry, GKE, and IAM Credentials APIs
#   2. Configure Workload Identity Federation for GitHub
#   3. Grant Artifact Registry Admin + Kubernetes Engine Developer roles
#   4. Fill in the env block below

name: 'Build and Deploy to GKE'

on:
  push:
    branches:
      - '"main"'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # node24 guard — June 2 2026 deadline
  PROJECT_ID: 'my-project'           # TODO: update
  GAR_LOCATION: 'us-central1'        # TODO: update
  GKE_CLUSTER: 'cluster-1'           # TODO: update
  GKE_ZONE: 'us-central1-c'          # TODO: update
  DEPLOYMENT_NAME: 'gke-test'        # TODO: update
  REPOSITORY: 'samples'              # TODO: update
  IMAGE: 'static-site'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'  # TODO: update

jobs:
  setup-build-publish-deploy:
    name: 'Setup, Build, Publish, and Deploy'
    runs-on: 'ubuntu-latest'
    environment: 'production'
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v5'  # node24 runtime (was @v4 / node20)

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'

      - name: 'Docker Auth'
        uses: 'docker/login-action@v4'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.auth_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: 'Set up GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          location: '${{ env.GKE_ZONE }}'

      - name: 'Build and push Docker container'
        run: |-
          DOCKER_TAG="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"
          docker build \\
            --tag "${DOCKER_TAG}" \\
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \\
            --build-arg GITHUB_REF="${GITHUB_REF}" \\
            .
          docker push "${DOCKER_TAG}"

      - name: 'Set up Kustomize'
        run: |-
          curl -sfLo kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          chmod u+x ./kustomize

      - name: 'Deploy to GKE'
        run: |-
          ./kustomize edit set image LOCATION-docker.pkg.dev/PROJECT_ID/REPOSITORY/IMAGE:TAG=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA
          ./kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/$DEPLOYMENT_NAME
          kubectl get services -o wide
