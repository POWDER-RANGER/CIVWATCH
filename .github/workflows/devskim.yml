name: DevSkim Security Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 1 * * 0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  devskim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5  # node24 runtime (was @v4 / node20)

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1  # pinned to latest stable
        with:
          directory-to-scan: .

      - name: Upload DevSkim SARIF file
        uses: github/codeql-action/upload-sarif@v4  # node24 runtime (was @v3)
        with:
          sarif_file: devskim-results.sarif
