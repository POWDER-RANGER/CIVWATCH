name: PSScriptAnalyzer PowerShell Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write

jobs:
  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5  # node24 runtime (was @v4 / node20)

      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@v1.1
        with:
          path: .\\
          recurse: true
          output: results.sarif
          settings: CodeFormatting

      - name: Upload PSScriptAnalyzer results
        uses: github/codeql-action/upload-sarif@v5  # node24 runtime (was @v4)
        with:
          sarif_file: results.sarif
