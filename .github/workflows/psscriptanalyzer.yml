name: PSScriptAnalyzer PowerShell Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write

jobs:
  psscriptanalyzer:
    if: false  # Disabled: no .ps1 files in codebase. Re-enable when PowerShell modules are added.
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5  # node24 runtime (was @v4 / node20)

      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f # v1.1
        with:
          path: .\\
          recurse: true
          output: results.sarif
          settings: CodeFormatting

      - name: Upload PSScriptAnalyzer results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4  # node24 runtime (was @v4)
        with:
          sarif_file: results.sarif
