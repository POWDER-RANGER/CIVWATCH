name: PSScriptAnalyzer PowerShell Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write

jobs:
  psscriptanalyzer:
    if: false  # Disabled: no .ps1 files in codebase. Re-enable when PowerShell modules are added.
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5  # node24 runtime (was @v4 / node20)

      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f # v1.1
        with:
          path: .\\
          recurse: true
          output: results.sarif
          settings: CodeFormatting

      - name: Upload PSScriptAnalyzer results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4  # node24 runtime (was @v4)
        with:
          sarif_file: results.sarif
