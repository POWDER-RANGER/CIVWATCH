name: OpenSSF Scorecard

on:
  branch_protection_rule:
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 6'
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # node24 guard — June 2 2026 deadline

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5  # node24 runtime (was @v4 / node20)
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v5  # node24 runtime (was @v7 — skipping to current)
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v5  # node24 runtime (was @v4)
        with:
          sarif_file: results.sarif
