name: OpenSSF Scorecard

on:
  branch_protection_rule:
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 6'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Job-level, not workflow-level: publish_results rejects workflows with global env.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # node24 guard — June 2 2026 deadline
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5  # node24 runtime (was @v4 / node20)
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5  # node24 runtime (was @v7 — skipping to current)
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4  # v5 does not exist; v4 is the current major
        with:
          sarif_file: results.sarif
