name: Release — Windows .exe + Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  # -----------------------------------------------------------------------
  # JOB 1: Build Windows .exe via Electron Forge (NSIS installer)
  # -----------------------------------------------------------------------
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: civwatch-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: civwatch-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend dist into Electron app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\renderer\dist
          Copy-Item -Recurse -Force ..\frontend\dist\* .\renderer\dist\

      - name: Compile TypeScript
        run: npx tsc --noEmit false --outDir dist

      - name: Electron Forge Make (NSIS)
        run: npm run make
        env:
          NODE_ENV: production
          npm_package_version: ${{ github.ref_name }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: civwatch-windows-exe
          path: civwatch-desktop/out/make/squirrel.windows/**/*.exe
          if-no-files-found: warn

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: civwatch-windows-nsis
          path: civwatch-desktop/out/make/nsis/**/*.exe
          if-no-files-found: warn

  # -----------------------------------------------------------------------
  # JOB 2: Build Android APK via Capacitor + Gradle
  # -----------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend deps & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Install android package deps
        working-directory: android
        run: |
          npm ci

      - name: Capacitor sync
        working-directory: android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: civwatch-android-apk
          path: android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # -----------------------------------------------------------------------
  # JOB 3: Create GitHub Release and attach artifacts
  # -----------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows NSIS artifact
        uses: actions/download-artifact@v4
        with:
          name: civwatch-windows-nsis
          path: release-artifacts/windows
        continue-on-error: true

      - name: Download Windows Squirrel artifact
        uses: actions/download-artifact@v4
        with:
          name: civwatch-windows-exe
          path: release-artifacts/windows
        continue-on-error: true

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: civwatch-android-apk
          path: release-artifacts/android
        continue-on-error: true

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CIVWATCH ${{ github.ref_name }}
          body: |
            ## CIVWATCH ${{ github.ref_name }}

            Civic transparency platform — government data ingestion, ML anomaly scoring, and document analysis.

            ### Downloads
            | Platform | File | Notes |
            |---|---|---|
            | **Windows** | `CIVWATCH-Setup-*.exe` | NSIS installer, runs on Windows 10/11 x64 |
            | **Android** | `app-debug.apk` | Debug APK, enable "Install from unknown sources" |

            ### What’s included
            - FastAPI ML scoring service (TF-IDF + DBSCAN anomaly detection)
            - Backend ingestion workers for USASpending.gov + Congress.gov
            - Electron desktop shell with auto-updater
            - React frontend dashboard

            ### Install (Windows)
            1. Download `CIVWATCH-Setup-*.exe`
            2. Run the installer — creates Start Menu entry + Desktop shortcut
            3. App auto-updates on launch

            ### Install (Android)
            1. Download `app-debug.apk`
            2. Enable **Settings → Security → Install unknown apps**
            3. Open the APK file to install
          files: |
            release-artifacts/windows/*.exe
            release-artifacts/android/*.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
