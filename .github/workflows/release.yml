name: Release — Windows .exe + Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:

  # -----------------------------------------------------------------------
  # JOB 1: Build Windows .exe via Electron Forge (NSIS installer)
  # -----------------------------------------------------------------------
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install desktop dependencies
        working-directory: civwatch-desktop
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Copy frontend dist into Electron renderer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path civwatch-desktop\renderer\dist | Out-Null
          Copy-Item -Recurse -Force frontend\dist\* civwatch-desktop\renderer\dist\

      - name: Electron Forge Make (NSIS)
        working-directory: civwatch-desktop
        run: npm run make
        env:
          NODE_ENV: production

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: civwatch-windows-nsis
          path: civwatch-desktop/out/make/nsis/**/*.exe
          if-no-files-found: warn

      - name: Upload Squirrel exe
        uses: actions/upload-artifact@v4
        with:
          name: civwatch-windows-exe
          path: civwatch-desktop/out/make/squirrel.windows/**/*.exe
          if-no-files-found: warn

  # -----------------------------------------------------------------------
  # JOB 2: Build Android APK via Capacitor + Gradle
  # -----------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend deps and build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Install android package deps
        working-directory: android
        run: npm install

      - name: Initialize Capacitor Android project if needed
        working-directory: android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor sync
        working-directory: android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: civwatch-android-apk
          path: android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # -----------------------------------------------------------------------
  # JOB 3: Create GitHub Release
  # -----------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: civwatch-windows-nsis
          path: release-artifacts/windows
        continue-on-error: true

      - name: Download Windows Squirrel
        uses: actions/download-artifact@v4
        with:
          name: civwatch-windows-exe
          path: release-artifacts/windows
        continue-on-error: true

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: civwatch-android-apk
          path: release-artifacts/android
        continue-on-error: true

      - name: List artifacts
        run: find release-artifacts -type f 2>/dev/null | sort || echo 'No artifacts found'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CIVWATCH ${{ github.ref_name }}
          body: |
            ## CIVWATCH ${{ github.ref_name }}

            Civic transparency platform — government data ingestion, ML anomaly scoring, and document analysis.

            ### Downloads
            | Platform | File | Notes |
            |---|---|---|
            | **Windows** | `CIVWATCH-Setup-*.exe` | NSIS installer, Windows 10/11 x64 |
            | **Android** | `app-debug.apk` | Enable "Install from unknown sources" |

            ### What's included
            - FastAPI ML scoring service (TF-IDF + DBSCAN anomaly detection)
            - Backend ingestion workers (USASpending.gov + Congress.gov)
            - Electron desktop shell with auto-updater
            - React frontend dashboard

            ### Install (Windows)
            1. Download `CIVWATCH-Setup-*.exe`
            2. Run installer — creates Start Menu + Desktop shortcut
            3. App auto-updates on launch

            ### Install (Android)
            1. Download `app-debug.apk`
            2. Enable Settings → Security → Install unknown apps
            3. Open the APK to install
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
