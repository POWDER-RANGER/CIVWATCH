name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Force Node 24 runtime for all JavaScript actions.
# Guards against marketplace actions that still declare node20 in their action.yml.
# GitHub default switches to Node 24 on June 2, 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  # ── Backend ──────────────────────────────────────────────
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://civwatch:test@localhost:5432/civwatch_test
          JWT_SECRET: test-secret-key-minimum-32-characters-long
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          directory: backend/coverage
          flags: backend

  # ── ML Service ───────────────────────────────────────────
  ml:
    name: ML Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest pytest-cov pytest-asyncio httpx

      - name: Lint
        run: |
          pip install flake8 black
          black --check .
          flake8 . --max-line-length=120 --exclude=__pycache__

      - name: Run tests
        run: pytest --cov=. --cov-report=xml --passWithNoTests -v

      - name: Validate FastAPI app starts
        run: python -c "from main import app; print('FastAPI app import: OK')"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          directory: ml
          flags: ml

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    name: Frontend (Vite/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ── Security Scan ────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
