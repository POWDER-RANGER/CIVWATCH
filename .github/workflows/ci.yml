name: CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: civwatch
          POSTGRES_PASSWORD: civwatch
          POSTGRES_DB: civwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civwatch" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U civwatch; do sleep 1; done
        env:
          PGPASSWORD: civwatch

      - name: Run migrations
        run: |
          export DATABASE_URL=postgres://civwatch:civwatch@localhost:5432/civwatch_test
          psql "$DATABASE_URL" -f backend/migrations/20260628_add_refresh_tokens.sql
          psql "$DATABASE_URL" -f backend/migrations/20260628_add_outbox.sql
        env:
          PGPASSWORD: civwatch

      - name: Lint
        run: npm run lint || true

      - name: Unit tests
        run: npm test --silent

      - name: Integration smoke
        run: |
          export DATABASE_URL=postgres://civwatch:civwatch@localhost:5432/civwatch_test
          npm run start:prod &
          sleep 3
          curl -fSsf http://localhost:3000/health || (cat /tmp/backend.log && exit 1)

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
