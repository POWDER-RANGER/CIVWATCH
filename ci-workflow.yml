name: CI

# Continuous Integration workflow that runs on every pull request and push to main.
# This workflow ensures code quality through automated testing, linting, and coverage analysis.
#
# The workflow runs multiple jobs in parallel for faster feedback:
# - test: Runs the full test suite with coverage requirements
# - lint: Checks code style and common errors
# - security: Scans for security vulnerabilities
#
# All jobs must pass before a pull request can be merged.

on:
  # Run on all pull requests
  pull_request:
    # Optionally filter by paths to avoid running when only docs change:
    # paths-ignore:
    #   - 'docs/**'
    #   - '**.md'
  
  # Run on pushes to main to validate merged code
  push:
    branches:
      - main
  
  # Allow manual triggering for testing the workflow itself
  workflow_dispatch:

# Cancel in-progress runs of this workflow when a new commit is pushed
# This saves CI minutes and provides faster feedback on the latest code
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- TEST JOB: Run full test suite with coverage ---
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    
    # Test against multiple Python versions to ensure compatibility
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      # Continue running other matrix jobs even if one fails
      # This helps identify version-specific issues
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Cache pip dependencies for faster subsequent runs
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Use --break-system-packages flag for containerized environments
          pip install --break-system-packages -r requirements.txt
          pip install --break-system-packages -r requirements-dev.txt
          
          # Install test dependencies
          pip install --break-system-packages pytest pytest-cov pytest-xdist pytest-timeout
      
      - name: Run unit tests with coverage
        run: |
          # Run tests in parallel with pytest-xdist for speed
          # -n auto: Use all available CPU cores
          # --cov: Measure code coverage
          # --cov-report: Generate both terminal and XML reports
          # --cov-fail-under: Fail if coverage drops below threshold
          pytest \
            -n auto \
            --cov=obelisk \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            --timeout=300 \
            tests/unit/
      
      - name: Run integration tests
        run: |
          # Integration tests are slower and may require services
          # Run without parallelization to avoid resource conflicts
          pytest \
            --cov=obelisk \
            --cov-append \
            --cov-report=term-missing \
            --cov-report=xml \
            --timeout=600 \
            tests/integration/
      
      - name: Run security tests
        run: |
          # Security tests validate vault isolation, RBAC, crypto
          pytest \
            -m security \
            --cov=obelisk \
            --cov-append \
            --cov-report=term-missing \
            --cov-report=xml \
            --timeout=300 \
            tests/security/
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false  # Don't fail CI if Codecov upload fails
        # Always upload even if tests failed, to track coverage trends
        if: always()
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
        if: always()
  
  # --- LINT JOB: Code style and quality checks ---
  lint:
    name: Code Quality (Linting & Formatting)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          pip install --break-system-packages ruff black mypy
      
      - name: Run Ruff linter
        run: |
          # Ruff is a fast Python linter that catches common errors
          # Exit code 1 if any issues are found
          ruff check . --output-format=github
        continue-on-error: false
      
      - name: Check code formatting with Black
        run: |
          # Black enforces consistent code style
          # --check: Don't modify files, just report differences
          # --diff: Show what would change
          black --check --diff .
        continue-on-error: false
      
      - name: Run type checking with mypy
        run: |
          # mypy catches type-related bugs before runtime
          # Ignore missing imports from third-party libraries without stubs
          mypy obelisk --ignore-missing-imports
        # Allow type check failures while you're adding type hints
        # Set to false once type coverage is comprehensive
        continue-on-error: true
  
  # --- SECURITY JOB: Dependency vulnerability scanning ---
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --break-system-packages -r requirements.txt
          pip install --break-system-packages safety bandit
      
      - name: Run Safety check for known vulnerabilities
        run: |
          # Safety checks dependencies against a database of known CVEs
          # --json: Output results in JSON for parsing
          # Or use: safety check --full-report for detailed output
          safety check --json || true
        # Use || true to prevent failing on known issues during development
        # Remove this once you've addressed all vulnerabilities
      
      - name: Run Bandit security linter
        run: |
          # Bandit scans Python code for common security issues
          # -r: Recursive scan
          # -f: Output format (json, txt, csv)
          # -ll: Only report medium and high severity issues
          bandit -r obelisk -f json -o bandit-report.json -ll
        continue-on-error: true
      
      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
        if: always()

  # --- BUILD JOB: Verify package builds successfully ---
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: |
          pip install --break-system-packages build twine
      
      - name: Build distribution packages
        run: |
          # Build both source distribution and wheel
          python -m build
      
      - name: Check distribution with twine
        run: |
          # Verify the built packages meet PyPI requirements
          twine check dist/*
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

# --- WORKFLOW STATUS BADGE ---
#
# Add this to your README.md to show CI status:
#
# [![CI](https://github.com/POWDER-RANGER/OBLISK/actions/workflows/ci.yml/badge.svg)](https://github.com/POWDER-RANGER/OBLISK/actions/workflows/ci.yml)
#
# The badge will show "passing" (green) or "failing" (red) based on the latest run

# --- CUSTOMIZATION CHECKLIST ---
#
# 1. Replace 'obelisk' with your actual Python package name in coverage commands
# 2. Adjust Python versions in matrix to match your target versions
# 3. Update paths in pytest commands to match your test directory structure
# 4. Configure Codecov:
#    - Sign up at codecov.io
#    - Add your repository
#    - Add CODECOV_TOKEN to repository secrets if using private repo
# 5. Adjust coverage threshold (--cov-fail-under=80) based on your goals
# 6. Review and enable/disable continue-on-error flags based on your strictness level
# 7. Add any additional test markers (pytest -m marker) you use
# 8. If you don't use mypy/type hints yet, you can remove that step
# 9. Update the build job if you're not building a Python package

# --- TESTING BEST PRACTICES ENFORCED ---
#
# This workflow enforces several quality standards:
#
# 1. Coverage requirement: At least 80% of code must be tested
#    - Prevents shipping untested code paths
#    - Catches regressions in test coverage
#
# 2. Multiple test categories: unit, integration, security
#    - Unit tests: Fast, isolated component tests
#    - Integration tests: Multi-component interaction tests  
#    - Security tests: Crypto, auth, vault isolation validation
#
# 3. Timeout protection: Tests must complete in reasonable time
#    - Catches infinite loops and performance regressions
#    - Prevents CI from hanging indefinitely
#
# 4. Parallel execution: Tests run faster using all CPU cores
#    - Reduces feedback time from ~10 minutes to ~2 minutes
#    - Must ensure tests are independent and don't share state
#
# 5. Linting and formatting: Consistent code style
#    - Ruff catches common bugs and code smells
#    - Black ensures uniform formatting
#    - Makes code reviews focus on logic, not style debates
#
# 6. Security scanning: Detect vulnerabilities early
#    - Safety checks for known CVEs in dependencies
#    - Bandit scans for common security anti-patterns
#
# 7. Build verification: Ensure package is distributable
#    - Catches setup.py or pyproject.toml errors
#    - Validates package metadata before release

# --- COMMON ISSUES AND SOLUTIONS ---
#
# Issue: Tests pass locally but fail in CI
# Cause: Environment differences (Python version, dependencies, OS)
# Fix: Run tests in Docker locally to match CI environment
#
# Issue: Intermittent test failures
# Cause: Tests depend on timing, external services, or shared state
# Fix: Use proper fixtures, mocking, and test isolation
#
# Issue: CI runs too slowly (>10 minutes)
# Cause: Too many serial operations, slow dependencies
# Fix: Use pytest-xdist for parallel tests, cache dependencies
#
# Issue: Coverage drops unexpectedly
# Cause: New code added without tests
# Fix: Write tests for new code paths before merging
#
# Issue: Linting errors in CI but not locally
# Cause: Different linter versions or configuration
# Fix: Pin linter versions in requirements-dev.txt
