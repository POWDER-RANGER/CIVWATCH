# CIVWATCH — Full Stack Docker Compose
# Starts: ML service, Backend API, Frontend, Scraper, Nginx, PostgreSQL, Redis
#
# Usage:
#   docker compose up --build
#   Open http://localhost in your browser

version: '3.9'

networks:
  civwatch_net:
    driver: bridge

volumes:
  pg_data:
  redis_data:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: civwatch-db
    restart: unless-stopped
    networks: [civwatch_net]
    environment:
      POSTGRES_USER: civwatch
      POSTGRES_PASSWORD: civwatch_dev
      POSTGRES_DB: civwatch
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: civwatch-redis
    restart: unless-stopped
    networks: [civwatch_net]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # ML Service — FastAPI (Python)
  # ---------------------------------------------------------------------------
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: civwatch-ml
    restart: unless-stopped
    networks: [civwatch_net]
    environment:
      ML_PORT: "5000"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Scraper Service — FastAPI (Python)
  # ---------------------------------------------------------------------------
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: civwatch-scraper
    restart: unless-stopped
    networks: [civwatch_net]
    depends_on:
      - backend
    environment:
      SCRAPER_PORT: "5001"
      CIVWATCH_BACKEND_URL: http://backend:3000/api
      CIVWATCH_API_KEY: ${CIVWATCH_API_KEY:-}
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Backend API — Node.js / TypeScript
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civwatch-backend
    restart: unless-stopped
    networks: [civwatch_net]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://civwatch:civwatch_dev@db:5432/civwatch
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml:5000
      SCRAPER_URL: http://scraper:5001
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      JWT_EXPIRES_IN: 24h
      REFRESH_TOKEN_SECRET: ${JWT_SECRET:-changeme_in_production}_refresh
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CIVWATCH_API_KEY: ${CIVWATCH_API_KEY:-}
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Frontend — React (Vite) served by Nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civwatch-frontend
    restart: unless-stopped
    networks: [civwatch_net]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: /api
      VITE_WS_URL: /ws
    expose:
      - "5173"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Nginx — Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: civwatch-nginx
    restart: unless-stopped
    networks: [civwatch_net]
    depends_on:
      - frontend
      - backend
      - scraper
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
